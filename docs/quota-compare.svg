<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" role="img" aria-label="한 번 시킬 때 쓰는 5시간 한도. 시험지 복원 스킬은 교재 10쪽 51문제에 10.6%, HWPick은 교재 8쪽 57문제에 0.7%, 교재 15쪽 106문제에 1.2~1.4%.">
  <rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#ffffff" stroke="#d9dee7"/>
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif" fill="#1c2230">
    <text x="32" y="46" font-size="19" font-weight="700">한 번 시킬 때 쓰는 5시간 한도</text>
    <text x="32" y="70" font-size="13" fill="#5b6474">구글 안티그래비티 기준 · 막대가 짧을수록 적게 씁니다</text>

    <text x="32" y="112" font-size="14">시험지 복원 스킬 · 교재 10쪽, 51문제</text>
    <rect x="32" y="122" width="540" height="20" rx="4" fill="#b8bec9"/>
    <text x="584" y="138" font-size="16" font-weight="700" fill="#5b6474">10.6%</text>

    <text x="32" y="180" font-size="14">HWPick · 교재 8쪽, 57문제</text>
    <rect x="32" y="190" width="36" height="20" rx="4" fill="#2457d6"/>
    <text x="80" y="206" font-size="16" font-weight="700" fill="#2457d6">0.7%</text>

    <text x="32" y="248" font-size="14">HWPick · 교재 15쪽, 106문제</text>
    <rect x="32" y="258" width="73" height="20" rx="4" fill="#9db5ee"/>
    <rect x="32" y="258" width="63" height="20" rx="4" fill="#2457d6"/>
    <text x="117" y="274" font-size="16" font-weight="700" fill="#2457d6">1.2~1.4%</text>

    <text x="32" y="310" font-size="13" fill="#5b6474">문제 하나당 약 17분의 1 · 복원 스킬의 값은 그 스킬의 변경 기록(v2.8.0)에 적힌 값입니다</text>
  </g>
</svg>
