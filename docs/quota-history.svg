<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" role="img" aria-label="같은 57문제를 읽는 방식에 따른 5시간 한도. 큰 모델로 한 번 읽기 약 10%, 가벼운 모델로 한 번 읽기 2.2%, 가벼운 모델로 다섯 번 읽고 다수결 0.7~0.8%.">
  <rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#ffffff" stroke="#d9dee7"/>
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif" fill="#1c2230">
    <text x="32" y="46" font-size="19" font-weight="700">같은 57문제, 읽는 방식에 따른 한도</text>
    <text x="32" y="70" font-size="13" fill="#5b6474">HWPick을 만들며 바꿔 온 방식 · 괄호는 기준 답과 같았던 문제 수</text>

    <text x="32" y="112" font-size="14">큰 모델(Flash)로 한 번 읽기 (57문제 중 56)</text>
    <rect x="32" y="122" width="540" height="20" rx="4" fill="#b8bec9"/>
    <text x="584" y="138" font-size="16" font-weight="700" fill="#5b6474">약 10%</text>

    <text x="32" y="180" font-size="14">가벼운 모델(Flash Lite)로 한 번 읽기 (57문제 중 51~53)</text>
    <rect x="32" y="190" width="117" height="20" rx="4" fill="#b8bec9"/>
    <text x="161" y="206" font-size="16" font-weight="700" fill="#5b6474">2.2%</text>

    <text x="32" y="248" font-size="14">가벼운 모델로 다섯 번 읽고 다수결 · 지금 방식 (57문제 중 56~57)</text>
    <rect x="32" y="258" width="42" height="20" rx="4" fill="#2457d6"/>
    <text x="86" y="274" font-size="16" font-weight="700" fill="#2457d6">0.7~0.8%</text>

    <text x="32" y="310" font-size="13" fill="#5b6474">가벼운 모델에게 여러 번 읽히면 큰 모델 한 번보다 한도를 훨씬 덜 쓰고, 정확도는 떨어지지 않았습니다</text>
  </g>
</svg>
