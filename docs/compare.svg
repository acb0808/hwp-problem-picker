<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" role="img" aria-label="hwp-exam-restoration과 견준 결과. 한도는 문제 하나당 17배 적게, 시간은 문제 하나당 2배 빠르게, 정확도는 57문제 중 56~57문제 일치. 5시간 한도 10.6% 대 0.7%, 걸린 시간 12.7분 대 6.6분.">
  <rect x="0.5" y="0.5" width="759" height="479" rx="12" fill="#ffffff" stroke="#d9dee7"/>
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif" fill="#1c2230">
